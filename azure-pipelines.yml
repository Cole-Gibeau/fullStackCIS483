trigger:
  batch: true
  branches:
    include:
      - '*'

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: true
    persistCredentials: true

  - bash: |
      set -euo pipefail

      # Fetch every ADO branch and tag.
      git fetch origin \
        '+refs/heads/*:refs/sync/*' \
        --tags

      # Authenticate using the secret GitHub token.
      auth=$(printf 'x-access-token:%s' "$GITHUB_PAT" | base64 -w 0)

      # Copy branches, tags, and commit history to GitHub.
      git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
        push --atomic \
        https://github.com/Cole-Gibeau/fullStackCIS483.git \
        'refs/sync/*:refs/heads/*' \
        'refs/tags/*:refs/tags/*'
    displayName: Sync ADO repository to GitHub
    env:
      GITHUB_PAT: $(GITHUB_PAT)